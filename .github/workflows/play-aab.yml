name: OneMoreCase 0.2.2 vc5 ad-free Play AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'android/**'
      - 'web/**'
      - '.github/workflows/play-aab.yml'

permissions:
  contents: write

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
      - name: Build signed ad-free release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$AAB"
          ! grep -R -qE 'play-services-ads|user-messaging-platform|com.google.android.gms.ads|com.google.android.ump|ADMOB_' app android web
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING=$("$AAPT" dump badging "$APK")
          grep -q "package: name='com.defidev.onemorecase'" <<<"$BADGING"
          grep -q "versionCode='5'" <<<"$BADGING"
          PERMS=$("$AAPT" dump permissions "$APK")
          ! grep -q 'android.permission.AD_ID' <<<"$PERMS"
          jarsigner -verify -certs "$AAB" >/dev/null
          cp "$AAB" OneMoreCase-0.2.2-vc5-ad-free.aab
          sha256sum OneMoreCase-0.2.2-vc5-ad-free.aab > OneMoreCase-0.2.2-vc5-ad-free.aab.sha256
          gh release create "onemorecase-ad-free-${{ github.run_number }}" OneMoreCase-0.2.2-vc5-ad-free.aab OneMoreCase-0.2.2-vc5-ad-free.aab.sha256 --title 'OneMoreCase 0.2.2 · ad-free Play AAB' --notes 'Signed ad-free release, versionCode 5.' --prerelease
