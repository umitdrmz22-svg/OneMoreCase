name: OneMoreCase signed Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in             ANDROID_KEYSTORE_BASE64             ANDROID_KEYSTORE_PASSWORD             ANDROID_KEY_ALIAS             ANDROID_KEY_PASSWORD
          do
            test -n "${!v:-}" || { echo "Missing GitHub Actions secret: $v"; exit 1; }
          done

      - uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore and verify upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/onemorecase-upload.jks"
          test -s "$RUNNER_TEMP/onemorecase-upload.jks"
          keytool -list             -keystore "$RUNNER_TEMP/onemorecase-upload.jks"             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/onemorecase-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:lintRelease :app:bundleRelease

      - name: Verify signed AAB and checksum
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -certs "$AAB" >/dev/null
          sha256sum "$AAB" > app/build/outputs/bundle/release/app-release.aab.sha256
          ls -lh "$AAB"
          cat app/build/outputs/bundle/release/app-release.aab.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: OneMoreCase-signed-play-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 14
