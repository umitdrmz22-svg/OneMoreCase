name: OneMoreCase Android quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate production AdMob secrets
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          set -euo pipefail
          for v in ADMOB_APP_ID ADMOB_REWARDED_ID ADMOB_INTERSTITIAL_ID; do
            test -n "${!v:-}" || { echo "Missing GitHub Actions secret: $v"; exit 1; }
          done
          [[ "$ADMOB_APP_ID" == ca-app-pub-*~* ]] || { echo "ADMOB_APP_ID format is invalid"; exit 1; }
          [[ "$ADMOB_REWARDED_ID" == ca-app-pub-*/* ]] || { echo "ADMOB_REWARDED_ID format is invalid"; exit 1; }
          [[ "$ADMOB_INTERSTITIAL_ID" == ca-app-pub-*/* ]] || { echo "ADMOB_INTERSTITIAL_ID format is invalid"; exit 1; }
          if [[ "$ADMOB_APP_ID$ADMOB_REWARDED_ID$ADMOB_INTERSTITIAL_ID" == *3940256099942544* ]]; then
            echo "Google demo AdMob IDs are not allowed for release validation"
            exit 1
          fi

      - uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Engine tests
        run: node tests/engine.test.js

      - name: Install browser test dependency
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: UI tests
        run: node tests/ui.test.js

      - name: Android lint and builds
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: gradle --no-daemon :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Verify Play target, ads and bundle
        run: |
          set -euo pipefail
          test -s app/build/outputs/bundle/release/app-release.aab
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          "$AAPT" dump badging "$RELEASE_APK" | grep -F "targetSdkVersion:'36'"
          "$AAPT" dump permissions "$RELEASE_APK" | grep -q "android.permission.INTERNET"
          "$AAPT" dump permissions "$RELEASE_APK" | grep -q "android.permission.ACCESS_NETWORK_STATE"
          ! "$AAPT" dump xmltree "$RELEASE_APK" AndroidManifest.xml | grep -q '3940256099942544'
          grep -q 'play-services-ads:25.5.0' app/build.gradle.kts
          grep -q 'user-messaging-platform:4.0.0' app/build.gradle.kts

      - uses: actions/upload-artifact@v4
        with:
          name: OneMoreCase-play-candidate
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
