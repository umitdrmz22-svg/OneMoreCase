name: OneMoreCase Android quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Engine tests
        run: node tests/engine.test.js
      - name: Install browser test dependency
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: UI tests
        run: node tests/ui.test.js
      - name: Android lint and builds
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug :app:bundleRelease
      - name: Verify Play target and bundle
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging "$APK" | grep -F "targetSdkVersion:'36'"
          "$AAPT" dump permissions "$APK" | grep -q "INTERNET" && { echo "Unexpected INTERNET permission"; exit 1; } || true
      - uses: actions/upload-artifact@v4
        with:
          name: OneMoreCase-play-candidate
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
